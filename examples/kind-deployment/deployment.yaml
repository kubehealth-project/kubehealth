apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubehealth-demo
  labels:
    app.kubernetes.io/name: kubehealth-demo
spec:
  replicas: 2
  progressDeadlineSeconds: 20
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubehealth-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubehealth-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
